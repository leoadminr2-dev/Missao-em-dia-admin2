name: Compilar Moreira TV Android
on:
  push:
    branches: [main]
    paths:
      - 'MoreiraTVAndroid/**'
      - '.github/workflows/build-moreira-tv-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar aplicativo
        working-directory: MoreiraTVAndroid
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar APK
        run: test -s MoreiraTVAndroid/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Moreira-TV-Android-APK
          path: MoreiraTVAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publicar APK para download direto
        run: |
          mkdir -p public-download
          cp MoreiraTVAndroid/app/build/outputs/apk/debug/app-debug.apk public-download/Moreira-TV-Android.apk
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add public-download/Moreira-TV-Android.apk
          if ! git diff --cached --quiet; then git commit -m 'Publicar APK Moreira TV Android'; git push; fi
